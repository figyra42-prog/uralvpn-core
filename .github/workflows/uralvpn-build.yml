name: UralVPN core build
on:
  workflow_dispatch:
  push:
    branches: [uralvpn]
permissions:
  contents: read
env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local
  TAGS: with_gvisor,with_quic,with_utls,with_grpc,badlinkname,tfogo_checklinkname0
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: bash .github/uralvpn-build.sh
      - uses: actions/upload-artifact@v5
        with:
          name: sing-box
          path: dist/
