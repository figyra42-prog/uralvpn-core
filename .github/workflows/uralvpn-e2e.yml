name: UralVPN e2e
on:
  workflow_dispatch:
  push:
    branches: [uralvpn]
    paths: ['.github/e2e/**', '.github/workflows/uralvpn-e2e.yml']
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: bash .github/e2e/build.sh
      - run: python3 .github/e2e/config.py
        env:
          SUB_URL: ${{ secrets.SUB_URL }}
      - run: bash .github/e2e/run.sh
